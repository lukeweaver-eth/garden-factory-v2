[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build required - static site'"

# Redirect /0x... addresses to garden rendering function
[[redirects]]
  from = "/0x*"
  to = "/.netlify/functions/garden/:splat"
  status = 200

# Redirect /essay to homepage (for old gardens with broken relative links)
[[redirects]]
  from = "/essay"
  to = "/"
  status = 301

# Serve index.html for root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    access-control-allow-origin = "*"
    cache-control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"
